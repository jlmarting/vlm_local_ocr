[project]
name = "vlm-local-ocr"
version = "0.1.0"
description = "OCR local de PDFs e imágenes y mapeo a un contrato JSON con llama.cpp"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ocr", "llama.cpp", "llm-local", "json-schema", "cli", "pdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
    "Topic :: Utilities",
]
dependencies = [
    "pypdfium2>=4.30",
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    "pillow>=10",
    "llama-cpp-python>=0.3.19",
    "jsonschema>=4.20",
]

[project.urls]
Repository = "https://github.com/jlmarting/vlm_local_ocr"
Issues = "https://github.com/jlmarting/vlm_local_ocr/issues"
Changelog = "https://github.com/jlmarting/vlm_local_ocr/blob/master/CHANGELOG.md"

[project.scripts]
vlm-ocr = "vlm_ocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_ocr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests que requieren el modelo GGUF real",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pillow>=10",
    "reportlab>=4",
]

[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python-cpu" }
