<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vlm-local-ocr</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>vlm-local-ocr</h1>
      <span id="status">conectando…</span>
    </header>
    <main>
      <section id="recents" class="recents" hidden>
        <h2>Recientes</h2>
        <div id="recents-list" class="recents-list"></div>
      </section>

      <section id="dropzone" class="dropzone">
        <p>Arrastra un PDF o una imagen aquí</p>
        <label class="button">
          Elegir archivo
          <input
            id="file"
            type="file"
            accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.bmp,.webp,.txt"
            hidden
          />
        </label>
      </section>

      <section id="viewer" hidden>
        <div class="toolbar">
          <button id="prev" type="button" title="Página anterior">‹</button>
          <span id="page-label">1 / 1</span>
          <button id="next" type="button" title="Página siguiente">›</button>
          <span class="spacer"></span>
          <button id="new" type="button" class="secondary">Nuevo documento</button>
        </div>
        <div class="content">
          <div id="page-wrap" class="page-wrap">
            <img id="page-image" alt="Página del documento" />
            <div id="boxes" class="boxes"></div>
          </div>
          <aside id="text-panel" class="text-panel"></aside>
        </div>

        <section id="contract" class="contract">
          <div class="toolbar">
            <h2>Contrato</h2>
            <button id="add-field" type="button">Añadir campo</button>
            <button id="extract" type="button">Probar extracción</button>
            <button id="homologate" type="button">Homologar plantilla</button>
            <span id="extract-summary" class="summary"></span>
          </div>
          <div class="toolbar exports">
            <button id="export-schema" type="button">Exportar schema</button>
            <button id="export-result" type="button">Exportar resultado</button>
            <button id="export-text" type="button">Exportar texto</button>
          </div>
          <div id="fields" class="fields"></div>
          <datalist id="sources">
            <option value="unidades"></option>
            <option value="importe"></option>
            <option value="devengado"></option>
            <option value="a_deducir"></option>
            <option value="base"></option>
            <option value="porcentaje"></option>
            <option value="cuota"></option>
          </datalist>
        </section>
      </section>

      <p id="error" class="error" hidden></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
